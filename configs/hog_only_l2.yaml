experiment_name: hog_only_l2

# Control run for the colour ablation: same as the baseline but L2 normalised, like hog_color.yaml.
hog:
  image_size: [128, 128]
  orientations: 9
  pixels_per_cell: [16, 16]
  cells_per_block: [2, 2]
  block_norm: L2-Hys
  transform_sqrt: true

l2_normalize: true

classifier:
  standardize: false
  dual: true
  C: 1.0
  max_iter: 3000
  tol: 0.0001
  random_state: 42
  n_jobs: -1
  verbose: 5
