experiment_name: hog_svm_baseline

hog:
  image_size: [128, 128]
  orientations: 9
  pixels_per_cell: [16, 16]
  cells_per_block: [2, 2]
  block_norm: L2-Hys
  transform_sqrt: true

classifier:
  # HOG blocks are already L2-Hys normalised, so no extra standardisation is needed.
  standardize: false
  dual: true
  C: 1.0
  max_iter: 3000
  tol: 0.0001
  random_state: 42
  n_jobs: -1
  verbose: 5
