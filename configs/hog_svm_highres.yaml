experiment_name: hog_svm_highres

# Same as the baseline but with 8x8 cells instead of 16x16, giving 8100 dimensions instead of 1764.
hog:
  image_size: [128, 128]
  orientations: 9
  pixels_per_cell: [8, 8]
  cells_per_block: [2, 2]
  block_norm: L2-Hys
  transform_sqrt: true

l2_normalize: false

classifier:
  standardize: false
  dual: true
  C: 1.0
  max_iter: 3000
  tol: 0.0001
  random_state: 42
  n_jobs: -1
  verbose: 5
