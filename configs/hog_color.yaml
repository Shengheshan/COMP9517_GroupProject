experiment_name: hog_color

hog:
  image_size: [128, 128]
  orientations: 9
  pixels_per_cell: [16, 16]
  cells_per_block: [2, 2]
  block_norm: L2-Hys
  transform_sqrt: true

# Spatial HSV histograms: 4x4 grid x (16 hue + 8 saturation + 8 value) bins.
color:
  image_size: [128, 128]
  grid: [4, 4]
  hue_bins: 16
  saturation_bins: 8
  value_bins: 8

# Scale each block to unit norm before concatenation so neither one dominates.
l2_normalize: true

classifier:
  standardize: false
  dual: true
  C: 1.0
  max_iter: 3000
  tol: 0.0001
  random_state: 42
  n_jobs: -1
  verbose: 5
